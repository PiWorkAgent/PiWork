name: Release

# 打 tag 触发：先跑与 CI 相同的测试门禁，再在四个平台上打包，最后把安装包
# 挂到 GitHub Release 的 Assets 上。
#
# 版本号真源是 apps/desktop/package.json —— tag 必须与它完全一致，否则在
# 打包前就失败（省下四台 runner 的时间）。
#
# 第一阶段不做代码签名：产物会被 macOS Gatekeeper / Windows SmartScreen
# 拦一次，用户手动允许即可。安装说明同时写进 DMG 和 Release notes
# （apps/desktop/build/install-notes.txt、.github/release-notes/install.md）。

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: '1'
  # 没有签名证书也照常出包（electron-builder 的自动探测会让位）。
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  # ── 门禁：与 ci.yml 同一套检查 ──────────────────────────────────────
  verify:
    name: Verify (build / typecheck / test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # ── 打包：一个平台一个 runner，互不阻塞 ─────────────────────────────
  # 安装包不再内置插件市场快照：插件从各自仓库的 Release 在线下载。市场
  # 快照曾把安装包撑大，而它只是"在线源不可达"时的兜底 —— 为一个大多数人
  # 用不到的场景付体积代价不划算。
  build:
    name: Package (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Windows 上也要用 bash：下面的脚本与 glob 都是 POSIX 写法。
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            platform: mac
            arch: arm64
          # Intel 架构需要 x64 runner，交叉产出不可靠（原生依赖按宿主架构装）。
          - name: macos-x64
            os: macos-15-intel
            platform: mac
            arch: x64
          - name: windows-x64
            os: windows-latest
            platform: win
            arch: x64
          - name: linux-x64
            os: ubuntu-22.04
            platform: linux
            arch: x64
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Check tag matches apps/desktop/package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./apps/desktop/package.json').version")"
          echo "tag:     v${tag}"
          echo "version: ${version}"
          if [ "${tag}" != "${version}" ]; then
            echo "::error::tag v${tag} 与 apps/desktop/package.json 的 version ${version} 不一致：改版本号后重新打 tag。"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Windows 运行时依赖 bash（MinGit busybox），打包前必须下载到 bash-bundle/。
      - name: Download Windows shell bundle
        if: matrix.platform == 'win'
        run: node apps/desktop/scripts/download-bash-bundle.cjs

      # electron-builder 对缺失的 extraResources 只发警告，不会失败；这里断言
      # 产物真的带了 shell，避免发布一个"能装但 agent 没有 shell"的安装包。
      - name: Verify Windows shell bundle
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $candidates = @(
            "apps/desktop/bash-bundle/ucrt64/bin/bash.exe",
            "apps/desktop/bash-bundle/ucrt64/bin/ash.exe",
            "apps/desktop/bash-bundle/mingw64/bin/bash.exe",
            "apps/desktop/bash-bundle/mingw64/bin/ash.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ }
          if (-not $found) {
            throw "bash bundle missing: the Windows installer would ship without a shell"
          }
          Write-Host "shell bundle present: $($found -join ', ')"

      # Windows 的实时防护会扫工作区里刚写出的文件，打包时持有句柄会 EBUSY。
      - name: 'Windows: keep Defender out of the workspace'
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:TEMP" -ErrorAction SilentlyContinue

      # pnpm 的 workspace 软链会让 electron-builder 去包目录外找文件。
      - name: Prepare packaging
        run: node apps/desktop/scripts/prepare-pack.cjs

      # 再留一次重试：EBUSY 是竞态，排除目录能大幅降低概率但不能证明为零。
      - name: Package
        working-directory: apps/desktop
        run: |
          for attempt in 1 2; do
            if pnpm exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never; then
              exit 0
            fi
            echo "::warning::electron-builder failed (attempt ${attempt}); retrying"
            sleep 15
          done
          echo "::error::electron-builder failed twice"
          exit 1

      - name: Check expected installers exist
        run: |
          case "${{ matrix.platform }}" in
            mac)   patterns="*.dmg *.zip" ;;
            win)   patterns="*.exe" ;;
            linux) patterns="*.AppImage *.deb" ;;
          esac
          for pattern in $patterns; do
            ls apps/desktop/release/$pattern > /dev/null || {
              echo "::error::packaging produced no ${pattern} for ${{ matrix.name }}"
              exit 1
            }
          done

      # 没有 Developer ID 时，DMG 里的安装说明就是用户唯一的离线指引。它不在
      # 说明 dmg.contents 的相对路径前提被破坏了 —— 宁可出包失败，也别把一个
      # 双击没反应又没有任何提示的安装包发出去。
      - name: Check the DMG carries the install notes
        if: matrix.platform == 'mac'
        run: |
          dmg="$(ls apps/desktop/release/*.dmg | head -1)"
          mountpoint="$(mktemp -d)"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mountpoint" > /dev/null
          status=0
          if [ -f "$mountpoint/安装说明.txt" ]; then
            echo "install notes found in $dmg"
          else
            echo "::error::$dmg does not contain 安装说明.txt"
            ls -la "$mountpoint"
            status=1
          fi
          hdiutil detach "$mountpoint" > /dev/null
          exit $status

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          # 只收安装包本身，忽略 blockmap / latest*.yml 等更新元数据。
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          compression-level: 0

  # ── 发布：把四个平台的产物挂到同一个 Release ────────────────────────
  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # 唯一需要写权限的 job：创建 Release 并上传 Assets。
      contents: write
    steps:
      # body_path 指向仓库里的文件。这个 job 以前没有 checkout，文件根本不存在，
      # action-gh-release 只打一行 warning 就退回空 body —— v0.3.3 的 Release
      # notes 里因此没有安装提示，而且流水线照样绿。checkout 加下面的断言把
      # 这类静默降级变成构建失败。
      - uses: actions/checkout@v7

      # 只取安装包产物（installers-*）：Release 上只该出现用户要下载的文件，
      # 其它 artifact 一律不挂。
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: artifacts
          merge-multiple: true

      # body_path 读不到时 action 只警告不报错（见 util.ts 的 releaseBody），
      # 所以文件在不在必须自己断。
      - name: Check the install notes are present
        run: |
          test -s .github/release-notes/install.md || {
            echo "::error::.github/release-notes/install.md 缺失或为空，Release notes 里不会有安装提示"
            exit 1
          }

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          # body 会排在自动生成的更新说明前面。没有 Developer ID 时这是用户
          # 唯一的安装指引，DMG 里也放了同一份（见 electron-builder.yml 的 dmg）。
          body_path: .github/release-notes/install.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          # v0.2.0-beta.1 这类带后缀的 tag 自动标为预发布。
          prerelease: ${{ contains(github.ref_name, '-') }}
